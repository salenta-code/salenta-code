name: Website
on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pages
        run: python3 website/build.py
      - name: Stop if the Impressum address is missing
        run: |
          if grep -q "ANSCHRIFT FEHLT" website/impressum.html; then
            echo "::error::Impressum: Anschrift fehlt in website/impressum.json"; exit 1
          fi
      - name: Keep only what the site needs
        run: rm -rf website/src website/build.py website/preview.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
