name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Keine Schlüssel im Repo
        run: bash scripts/privacy-check.sh
      - name: Jeder Symbol-Knopf hat einen Mouse-over-Hinweis
        run: python3 scripts/check-tooltips.py
      - name: Build
        run: swift build -c release --package-path App
      - name: Test
        run: swift test --package-path App
