name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and what is hard about it today.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Salenta Code help? Sketches and examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
