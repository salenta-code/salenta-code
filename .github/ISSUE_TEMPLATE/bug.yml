name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time! Please remove personal data, tokens and customer information from logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
  - type: input
    id: version
    attributes:
      label: Salenta Code version
      description: Salenta Code › About
      placeholder: "0.2.0"
    validations: { required: true }
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.4, MacBook Pro M3"
  - type: dropdown
    id: agent
    attributes:
      label: Which agent was involved?
      multiple: true
      options: [Claude Code, Codex, Cursor, Gemini CLI, Junie, OpenCode, Kiro, Ollama / local, OpenRouter, Not agent-related]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal data and tokens before pasting.
      render: text
